[project]
name = "segment-1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "levit@campus.technion.ac.il" }
]
requires-python = ">=3.11.9"
dependencies = [
    "datasets>=3.0",
    "ipykernel>=7.4.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "peft>=0.19.1",
    "scipy>=1.11",
    "tokenizers>=0.22",
    "torch>=2.12.0",
    "tqdm>=4.67",
    "transformers>=5.9.0",
]

[project.scripts]
segment-1 = "segment_1:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
